; ============================================================================
; Project configuration — the single source of tunable parameters. Each section
; maps 1-to-1 to a dataclass in foundry/config.py via ini('section', 'key', default).
; The CLI takes paths only; fixed implementation constants live in code.
; ============================================================================

[market]
; Active market plugin: us_equity | a_share | crypto_spot | crypto_perpetual
name = us_equity

[execution]
backend = cuda             ; explicit backend: cpu | cuda | portable

[us_equity]
; US equities daily (adjusted OHLC total-return basis; PIT universe filtered during parquet build)
data_dir     = ./data/us_equity_daily
start        = 2025-07-01
end          = 2026-06-30
cost_rate    = 0.0005     ; commission + half-spread, one-way symmetric
daily_borrow = 0.0        ; daily short borrow rate (annual rate / 252; 0 = none)

[a_share]
; China A-shares: raw signal OHLCV, historical cumulative adjustment for execution, explicit membership
data_dir       = ./data/a_share_pit
start          = 2024-03-01
end            = 2026-06-30
commission     = 0.00025  ; one-way commission (symmetric buy/sell)
stamp_tax_sell = 0.0005   ; stamp duty, sell side only
transfer_fee   = 0.00001  ; transfer fee, both sides

[crypto_spot]
; Daily long-only spot research on the continuous UTC calendar, next-day open execution
data_dir  = ./data/crypto_spot_daily
start     = 2024-01-01
end       = 2025-12-31
cost_rate = 0.001        ; one-way symmetric research assumption, not a real exchange quote

[crypto_perpetual]
; USDT linear isolated research model: daily targets, hourly mark-price risk events
data_dir = ./data/crypto_perpetual
history_start = 2025-01-01
start = 2025-07-01
end = 2025-12-31
symbols = BTCUSDT ETHUSDT SOLUSDT
leverage = 5.0
cost_rate = 0.0004         ; prespecified research fee, not a historical account VIP tier
maintenance_rate = 0.005  ; flat research margin schedule, not an exchange historical risk bracket
liquidation_fee = 0.0005  ; research liquidation charge, bounded by remaining isolated equity

[expr]
max_cost = 25             ; formula cost cap (shared by validator and search grammar; production comparisons + constants need 24, do not lower)

[cuda]
streams = 8                 ; streams owned by each CUDA runtime
candidate_batch = 256        ; read-only batch cap; tightened against free VRAM at load time (chosen from V100S 128/256/512/1024 benchmarks)
trial_batch = 16384          ; max candidate x weight trials per fused blended-book backtest call
precision = paired           ; auto: single FP32 screen; paired: two-FP32 screen; f64: reference. Screens retain FP64 final verification.
mixed_return_atol = 0.000001 ; calibrated per-day return absolute error budget; does not alter admission thresholds
mixed_error_safety = 16      ; safety multiplier on calibrated error for the admission uncertainty envelope; final acceptance is always FP64

[portfolio]
artifact_dir = ./data/candidates
weight_sum_atol = 1e-7      ; external target allocations: roundoff above the market gross cap is normalized; larger excess rejected
metric_atol = 1e-10         ; admission metric comparisons; also defines ties in rejected-trial diagnostics
; Portfolio admission: candidate added as H = cap_book(U + a*A, market allocation), judged on the real net-of-cost blended book.
min_sharpe_gain = 0.01       ; minimum gain in recency-weighted Sharpe (engineering tolerance, not a significance test)
weight_steps = 20            ; weight grid 1/N..1 plus the analytic tangency weight; weight = multiple of candidate book added to U
recent_halflife_days = 1095
max_members = 40
sharpe_scale = 0.1           ; tanh normalisation scale for portfolio Sharpe gain
growth_scale = 0.02          ; tanh scale for recency-weighted annualised log-growth gain (equally weighted with Sharpe)
; Violation scales for infeasible candidates V = sum max(0, -margin_j) / scale_j (shapes search reward and nearest-trial reporting only, not admission).
; Calibrated from the empirical distribution of a finished search run: python -m foundry calibrate <run_dir>.
; WARNING: current values were calibrated under convex blending (protocol v5); recalibrate after the first v6 run.
violation_scale_wsharpe = 0.081
violation_scale_sharpe = 0.063
violation_scale_cagr = 0.079
violation_scale_growth = 0.024

[search]
mode = gfn
seed_portfolio = equal       ; equal for a new study; current requires a library with the same study
objective = portfolio
null_shift = false
accept = false              ; persist admitted changes only with seed_portfolio=current
seed = 25
epochs = 5                  ; small end-to-end validation run
batch_size = 128             ; sampling batch; GPU book batch is still bounded by [cuda] candidate_batch and VRAM
probes = 2                   ; each probe evaluates 3 sibling actions x 4 shared completions
; Hard complexity caps from the 4 production members (11-13 tokens, TS nesting <= 2).
; gfn_0921 benchmark: relaxing to 24 tokens pushed 79-92% of samples to 15-17 tokens, G1 failures 0.5%->13.9%, cash books 6.6%->21.2%.
max_tokens = 13              ; total prefix tokens (operators + operands + windows + constants)
max_ts_depth = 2             ; max time-series operators along any root-to-leaf path
train_steps = 4
learning_rate = 0.002
opd_strength = 0.1           ; auxiliary OPD gradient norm ratio relative to TB
rho_max = 0.9                ; max positive return correlation with the portfolio and with each existing member
archive_size = 32
reweight_iterations = 3
reweight_batch = 32
reweight_every = 5           ; joint CEM reweighting on epoch 1, every 5 epochs, and upon admitting a new member

[single]
; Single-alpha objective (set search.objective=single; python -m foundry mine DIR): candidates are scored on their own book and admitted by a (correlation, Sharpe) gate.
; Gate derivation (Treynor-Black): optimal blend of portfolio P and candidate A has Sharpe^2 = S_p^2 + AR^2, AR = (S_a - rho*S_p) / sqrt(1 - rho^2)
;   => candidates contributing equally to P lie on the iso-appraisal curve S_a = rho*S_p + kappa*sqrt(1 - rho^2): lower rho requires lower Sharpe.
; kappa is set so the expected portfolio Sharpe gain >= [portfolio] min_sharpe_gain: observed AR = true + noise, empirical-Bayes posterior mean
;   E[AR | obs] = m + s*(obs - m) => kappa = m + (sqrt((S_p + Delta)^2 - S_p^2) - m) / s.
; m and s are not config knobs: measured each round against the current reference on a fixed grammar-uniform random population and its 1-3y null-shifted twins:
;   m = mean(obs AR on population), s = 1 - Var(twin AR) / Var(population AR). Measured 2026-09-21 (2,994 formulas):
;   vs equal-weight start: m=-0.38, s=0.49, kappa=0.69; vs production portfolio: m=-1.06, s=0.29, kappa=3.37 (gate closes itself).
; G2 = Sharpe >= max(portfolio-unknown, portfolio-known) (anchored at rho=0.7 <-> Sharpe 1.5; non-decreasing in rho):
;   portfolio-unknown: N = [portfolio] max_members exchangeable alphas with Sharpe S and pairwise corr rho give Sharpe_N = S*sqrt(N / (1 + (N-1)*rho)),
;     reaching target T requires S >= T*sqrt((1 + (N-1)*rho) / N), with T fixed by the anchor (T=1.78 at N=40); rho = mean corr with pool members.
;   portfolio-known: the TB curve above, but member weights in (0, 1] cannot short P => above rho* = S_p / sqrt(S_p^2 + kappa^2) the requirement stays at peak sqrt(S_p^2 + kappa^2).
anchor_correlation = 0.7
anchor_sharpe = 1.5
calibration_sample = 8192    ; population sample count (~3,000 non-cash unique books kept resident in VRAM)
recent_years = 2             ; every calendar year among the last N in the window must have Sharpe > recent_year_sharpe
recent_year_sharpe = 1.0
; In-gate multi-objective utility U = u_S*(weight_sharpe + weight_drawdown*u_D + weight_return*u_R): Sharpe is primary,
; u_S = tanh(S^+ / sharpe_scale), u_D = max(0, 1 - |maxdd| / drawdown_full), u_R = tanh(CAGR^+ / return_scale).
weight_sharpe = 0.6
weight_drawdown = 0.2
weight_return = 0.2
sharpe_scale = 2.0
drawdown_full = 0.6          ; u_D = 0 at this drawdown depth; the 30% project target maps to u_D = 0.5
return_scale = 1.0
; Out-of-gate constraint violation V = G2 Sharpe shortfall / scale + sum(recent-year Sharpe shortfalls / scale) (search reward only); scales = p75 among violators.
violation_scale_sharpe = 1.3
violation_scale_year = 3.35

[monitor]
frame_seconds = 0.1          ; local dashboard redraw interval (reads local files only)
push_seconds = 2             ; minimum interval between cloud status pushes (single persistent SSH session, pushed on change)
