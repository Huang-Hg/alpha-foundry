; ============================================================================
; 项目配置 — 可调参数集中处。每个 section ↔ 一个 dataclass(读法 ini('section','key',default))。
; 改这里 = 全局生效;CLI 仅暴露 per-run 路径。固定不变的实现常量已 inline 进代码,不在此。
; ============================================================================

[calendar]
; 市场时间画像 —— 引擎所有 bars-per-day / 年化 / deploy 深度常量的唯一来源(markets.MarketProfile)。
; crypto_daily(Quantiacs Q25 日线,2026-07-04 起 crypto 主线)| us_equity_daily | a_share_daily。
; (continuous24x7 永续 5m 画像随 1h crypto 栈 2026-07-25 删除。)
profile = crypto_daily

[q25_combo]
; 组合优化:单候选只作构件,所有准入检查作用于实际合成并扣成本后的组合。
min_sharpe_gain = 0.01       ; 近期加权 Sharpe 的最小实际增量(工程容差,非显著性检验)
weight_steps = 20           ; 固定权重网格 1/N..1,另评估解析建议权重
recent_halflife_days = 1095
submission_sharpe = 1.58    ; 最终组合研究目标,不用于淘汰单条候选
max_members = 40

[factor_mining]
; Q25 crypto_daily 数据目录(scripts/build_q25_dataset.py 从 quantiacs 构建 panel.parquet(OHLCV+liquid)
; + features.parquet(量价原语 + PLS)+ market.parquet(BTC 链上/股指/BTC regime/alt_rv 市场级序列);
; qnt 相关一律不入 git)
qnt_data_dir    = ./data/qnt_crypto
data_start      = 2015-01-01   ; 数据网格头(scripts/build_q25_dataset.py 的起点;= IS 前 1 年 warmup);数据终点 = 最新,研究止于 val_end
pool_capacity   = 12       ; 硬顶(2026-07-06 24→12:AlphaForge 实测最优 N≈10 + crypto 有效秩低)
; 挖矿窗口(gp-baseline / alphasage 共用;2026-07-04 起 Q25 crypto_daily 口径):竞赛 IS 从 2016 起,
; train 7.5y + val 3y(val 仅作池准入判据的 OOS 读数;18mo 太短证伪力不足);warmup=网格头 1y
; (2015-01-01,ts 最长窗 240 交易日 + 余量,export min_date 同步);test = 竞赛 live 期,天然 held out。
train_start     = 2016-01-01
train_end       = 2023-06-30
val_start       = 2023-07-01
val_end         = 2026-09-01

[features]
; OHLCV 提取分解特征层(scripts/build_q25_dataset.py → data/qnt_crypto/features.parquet)。
; 2026-07-05 池审计修复:成员书 N_eff=1.2(全池=OHLCV 价格位置一族)→ 数据层直接供给
; scale-free 原语(resret/rangepos/gkvol 等 8 个)+ 因果滚动 PLS 监督正交复合(plsa..plsd)。
; 改动此节须重跑派生脚本 + 重挖(词表产生式 ID 变)。
pls_components   = 4      ; PLS 复合特征数(NIPALS,score 彼此正交、按构造与 y 正协方差)
refit_days       = 30     ; expanding 重拟合间隔(行数;行 t 只用 ≤t-2 样本)
pls_warmup       = 365    ; PLS 首次拟合行(网格头起算;此前 plsa..d 为缺失)
beta_ewma_lambda = 0.97   ; resret 的 EWMA β 衰减(半衰期 ~23 交易日)

[dsl]
; DSL 公式树 cost 上限(α-Sem-k 预算),gp_baseline 搜索空间约束。
max_cost          = 25
min_cost          = 3
max_len           = 5     ; 推导 production 数上限(含 window leaf;GFN + GP 同刻度共用,2026-07-03 统一,
                          ; GP 侧 len(prefix)≡production 数)。两次独立证否,禁再放开:
                          ; ① 5→10(2026-07-05 q25d,rank-gate 口径):剪刀差 0.26→0.60;
                          ; ② 5→12 + cost 40(2026-07-24 q25e,自由书口径):train best 1.84→1.98
                          ;   而二级门 0/12 全灭,成员剪刀差 0.72~2.17(旧空间同协议曾出 1 个 0.38
                          ;   过门者)—— 自由度↑=噪声极值天花板↑,S≈10 书 Sharpe reward 付不起。
                          ; 自由书口径下 5 恰容单条干净结构(gt(close,ts_mean(close,240)) /
                          ; ts_rank(ts_arg_min(btc_rv,240),120) 均=5);双层乘法结构走部署层注入,不走挖矿。

[ts_book]
; 时序 long-only 书(2026-07-22 挖矿口径转向:截面选币 → 逐币时序状态;S≈10 截面辨识天花板
; 定量证否后的文献定论 —— TSMOM/趋势 = 大市值唯一净成本存活结构,见记忆 project-q25-mining-stat-ceiling)。
; 2026-07-24 自由书口径(扫除搜索器自由度限制):搜索/评估 = 公式直出敞口 clip[0,1]
; (rl.sizing.qnt_free_exposure)→ W = 敞口/n_liq;rank-gate 投影(ts_rank→gate)退位为
; 部署层原语,公式想要可显式写 ts_rank。reward = 书净 Sharpe − EW 锚净 Sharpe 不变。
; 2026-07-25 R4 滚动时序 CV 接入(用户令):reward/池准入统一换 cv_edge = 5 折(~18mo)
; 折 edge 中位数(evaluator._CV_FOLDS,零增量回测;>0 ⇔ ≥3/5 折胜锚)—— 时间轴尖峰树
; 在取出统计量处不给分。全窗 edge 仍报 net_sharpe(日志/电池 M3)。谱系:R3 邻域 min /
; R1 TM 07-24 reward 轴 A/B 证否;折一致性**后置滤器** 07-22 证否;R4 = 换取出统计量
; 本身,预注册待下一 run 仲裁(判据:剪刀差 median / 族构成 / 二级门过门率 vs 1/12 null)。
state_window = 120        ; 逐币状态窗(交易日)——部署层原语参数(现役 ts_arg_min 提交栈/diag 复现用);
                          ; 搜索侧自由书口径起不再消费
gross_scale  = 1.0        ; 组合层 gross 放大 λ:W=λ·gate/n_liq(Σ>1 由 qnt 内核顶格归一;仅作用
                          ; eval_pool_val/部署书,挖矿 reward 恒 λ=1 保信号形状)。2026-07-22 λ 前沿
                          ; (diag_ts_lambda_frontier):Sharpe 对 λ∈[1,3] 平坦(val 0.77-0.82),终值
                          ; 随 λ 升、maxDD 同步放大;λ=inf 满仓选择书 Sharpe 崩至 0.47 —— alpha 在
                          ; 择时表达而非选币。train「终值最大 s.t. maxDD≤30%」定 λ*=1(train λ=1
                          ; maxDD 已 −31.6%);调大 = 用户对 DD 预算的显式决策,勿代调。

[alpha_pool]
delta_floor       = 0.003      ; 最小正交贡献 Δ=q²·(1−R²)(2026-07-06 DPP 边际增益,质量进平方;q=时序书 edge;
                               ; floor 按 q² 尺度重标定:旧 0.02 配 q·(1−R²)+ 裸书 Sharpe≈1.2 口径)
; neff_slack(N_eff 自适应容量)2026-07-23 删:用户裁定冗余 —— 池尺寸只由 capacity 硬顶 + delta_floor 控制
; cos_sim_threshold(G2 嵌入去重)2026-07-22 删:policy net 06-27 删除后全管线 embed_fn=None,门从未生效

[alpha_library]
; 跨 run 累积的正交 alpha 库(只存因子树,不存 pnl 序列)。质量门 = edge>0(池准入同源)。
path     = output/alpha_library.json
corr_max = 0.5                 ; 入库/清理正交门:与已选因子 pnl |pearson| ≥此 → 冗余,拒
max_size = 500                 ; 定时清理上限:超额按 |rank_ic| 降序截断

[evaluator]
device = cuda                   ; 本地默认 cuda(T1000);上传 quant-server(torch+cpu)时改回 cpu

[backtest_reward]
; crypto 回测 = Quantiacs qnt 1:1(2026-07-04):成本 = ATR14×0.04 滑点(平台常量,内核硬编码,
; 动它即失去与平台跑分 1:1 → 不进 INI)。旧永续 5m PerpPolicy 路径(引擎+binding+INI 键)
; 2026-07-25 已彻底删除。
; top_k 2026-07-05 已删:top-K 机制全线退役(top-5 从未被证据支持,库效度诊断池级对比
; softmax val 1.27 > top5 1.09)。reward 书 = softmax 截面。
; 注意:sealed trade/signal.py 仍以 ini('backtest_reward','top_k',8) 读此键(缺失走默认 8)——
; 本地研究仓删除不影响 binance-trader live 配置副本。

[equity_costs]
; US 权益回测(EquityPolicy);复权 OHLC 总收益口径,年化 √252。无 funding/强平/impact。
cost_rate         = 0.0005     ; 佣金+半点差单边对称(fraction;研究级,~5bps)
daily_borrow      = 0.0        ; 空腿日借券费(年化借券利率/252;0=关)

[ashare_costs]
; 中国 A 股回测(ASharePolicy);qfq 复权 OHLC 总收益口径,年化 √242。long-only,无 funding/强平。
commission        = 0.00025    ; 佣金单边(万2.5;buy+sell 对称)
stamp_tax_sell    = 0.0005     ; 印花税**卖出单边**(万5,2023-08 减半后;非对称成本核心)
transfer_fee      = 0.00001    ; 过户费双边(万0.1)
price_limit_pct   = 0.10       ; 涨跌停幅度(沪深300 主板 ±10%);用于回测 trade_block 冻结

[gp_baseline]
; DEAP 强类型 GP 因子挖掘(NSGA-II 双目标:质量 + 行为多样性);cost + 长度预算全复用 [dsl](与 GFN
; 同源同刻度,2026-07-03 统一;旧 init_*_height / max_height 三旋钮已删,init 高度由 max_len 推导)。
; reward=flat 探针 2026-07-03 证否已删:flat 使 collected 322→27943(87×),train|IC| 更高(0.058 vs
; 0.042)但 val net +0.363→−0.187 —— 准入门挡不住海量多重比较的选择偏差;IC 搜索压的真实作用=收敛即正则。
pop_size        = 2000    ; 种群(须被 4 整除,selTournamentDCD)
n_gen           = 40      ; 代数
cxpb            = 0.7     ; 交叉概率
mutpb           = 0.2     ; 变异概率

[alphasage]
; AlphaSAGE GFlowNet alpha-mining baseline(独立 baseline,与 GP 平级,非改进 GP)
; P(α)∝R 采样;reward = R_IC + λ(T)·R_SA + η(T)·R_NOV;RGCN 结构感知编码器;cost 上限复用 [dsl]
hidden_dim          = 64      ; RGCN encoder hidden 维(节点 embedding + 消息维)
n_layers            = 2       ; RGCN 消息传递跳数
lr                  = 0.001   ; Adam 学习率(policy/encoder)
logz_lr             = 0.1     ; logZ 单独高 lr(GFlowNet 铁律:logZ 须追 log ΣR,共用低 lr 会致 TB 发散坍缩)
batch_size          = 16      ; 每 episode 采样轨迹数。16→48 吞吐 A/B 证否(2026-07-24 q25h vs
                              ; q25f/g 同协议):3× 采样量下 train best 2.04~2.13(vs ~1.9)而
                              ; 二级门 1/12→0/12、池 val 书 +0.86/+1.06→+0.66、成员剪刀差
                              ; min 0.20/0.16→0.72 —— 更大吞吐只推高 train 噪声极值,val 反降;
                              ; 与 episodes(2026-07-05)/max_len/词表同墙,搜索 scaling 四轴全证否。
n_episodes          = 1000    ; 训练 episode 数。1000→2000 A/B 证否(2026-07-05,q25e vs q25c 完整
                              ; 部署栈双窗):train 1.372→1.921 而 val 1.111→1.006,成员双窗同号率
                              ; 92%→75% —— 搜索深度翻倍全被 train-q 多重比较吃掉,准入门挡不住;
                              ; 与 max_len(q25d)/词表扩容(q25b)同墙,搜索侧 scaling 三轴全证否。
; reward 设计轴 A/B 证否(2026-07-24 q25i/q25j,随机零假设 1/12 为标尺,预注册判据,单跑各一次后删码):
;   R3 平台化(邻域最小 edge):池被趋势族占领(高原确实=趋势族,与 07-22 族判决一致)但成员
;     剪刀差 median 1.32 无改善、门 0/12 —— 邻域变体书高度相关,min 削不掉族级 train 噪声抬升;
;   R1 Treynor–Mazuy t(γ):train 凸性 t 可达 +14 但 t 选出的书裸 edge≈0(凸性≠盈利:保险型
;     凸性以低平均敞口为代价),池 val +0.39 < EW 锚;副产物诊断:不按 Sharpe 选择时成员剪刀差
;     median 1.3→0.89 —— 剪刀差主体=选择偏差(winner's curse)而非 regime 漂移的直接证据。
nov_weight          = 0.1     ; R_NOV 权重 η(与池正交新颖度;常数)
entropy_coef        = 0.01    ; 熵正则系数 β·H(π)(>0 需 save_estimator_outputs;防早熟坍缩)
entropy_temperature = 1.0     ; 熵温度
r_sa_weight         = 0.5     ; R_SA 结构稠密奖励 λ(0)(每 episode 线性退火 →0)
r_sa_k              = 16      ; R_SA kNN 结构邻居数(池内成员)
r_sa_tau            = 1.0     ; R_SA 结构相似度 softmax(−dist²/τ)温度
