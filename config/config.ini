; ============================================================================
; 项目配置 —— 可调参数的唯一来源。每个 section ↔ foundry/config.py 里的一个 dataclass
; (读法 ini('section','key',default))。CLI 只接路径;固定不变的实现常量写在代码里。
; ============================================================================

[market]
; 研究所用的市场插件(foundry/market/<name>.py):crypto | us_equity | a_share
name = crypto

[crypto]
; Quantiacs crypto 日线(Q25 = 市值前 10、只做多)。数据由本地 venues/quantiacs 构建,不入 git。
data_dir         = ./data/qnt_crypto
data_start       = 2015-01-01   ; 数据网格头 = 研究起点前 1 年暖机;网格随本地库增量延伸到最新
start            = 2016-01-01   ; 研究窗口起点 = 统计起点(竞赛 IS 起点),此前不持仓
end              = 2026-09-01   ; 研究窗口终点(含)
; 数据集特征层(venues/quantiacs/dataset.py → features.parquet;改动须重建数据集并重挖)
pls_components   = 4      ; PLS 复合特征数(NIPALS,分数两两正交、与次日收益正协方差)
pls_refit_days   = 30     ; 扩张窗重拟合间隔(行 t 只用 ≤t-2 的样本)
pls_warmup       = 365    ; PLS 首次拟合行(网格头起算;此前 plsa..d 缺失)
beta_ewma_lambda = 0.97   ; resret 的 EWMA β 衰减(半衰期约 23 天)

[us_equity]
; 美股日线(复权 OHLC 总收益口径;PIT 成分在构建 parquet 时过滤)
data_dir     = ./data/us_equity_daily
start        = 2025-07-01
end          = 2026-06-30
cost_rate    = 0.0005     ; 佣金 + 半点差,单边对称
daily_borrow = 0.0        ; 空头日借券费率(年化利率 / 252;0 = 不计)

[a_share]
; A 股日线(前复权 OHLC;只做多)
data_dir       = ./data/a_share_daily
start          = 2024-03-01
end            = 2026-06-30
commission     = 0.00025  ; 佣金单边(买卖对称)
stamp_tax_sell = 0.0005   ; 印花税,仅卖出
transfer_fee   = 0.00001  ; 过户费双边

[expr]
max_cost = 25             ; 公式 cost 上限(解析校验与搜索语法共用;生产成员的比较算子 + 常数结构要 24,不能降)

[cuda]
candidate_batch = 256        ; 只读批次上限;装载后再按空闲显存收紧(V100S 128/256/512/1024 实测后选定)
trial_batch = 16384          ; 融合持仓回测每次最多执行的候选 × 权重方案
precision = auto             ; FP32 日状态 / FP64 统计;误差超限与可能通过者自动升级 CUDA FP64
mixed_return_atol = 0.000001 ; 校准单日收益绝对误差预算;不改变准入门槛
mixed_error_safety = 16      ; 校准误差放大倍数,用于推导准入不确定区;最终接受恒为 FP64

[portfolio]
; 组合准入(协议 combo-cuda-v6):候选加到组合上 H = (U + a·A) / max(1, 当日总仓位),在实际合成、扣成本后的组合上判定。
min_sharpe_gain = 0.01       ; 近期加权 Sharpe 的最小实际增量(工程容差,非显著性检验)
weight_steps = 20            ; 权重网格 1/N..1,另评估解析建议权重;权重 = 候选持仓加到组合上的倍数
recent_halflife_days = 1095
submission_sharpe = 1.58     ; 最终组合研究目标,不用于淘汰单条候选
max_members = 40
sharpe_scale = 0.1           ; tanh 标准化的组合 Sharpe 改善尺度
growth_scale = 0.02          ; 与 Sharpe 等权的近期年化对数增长改善尺度
; 不可行候选的约束违反量 V = Σ max(0,-裕量_j)/尺度_j 的四个尺度(只影响搜索奖励与失败行报告的权重点,不影响准入)。
; 按一次搜索 run 的实测分布标定:python -m foundry calibrate <run 目录>。
; ⚠ 现值是在凸混合(协议 v5)下标定的;v6 首个 run 结束后须重新标定。
violation_scale_wsharpe = 0.081
violation_scale_sharpe = 0.063
violation_scale_cagr = 0.079
violation_scale_growth = 0.024

[search]
seed = 25
epochs = 20
batch_size = 128             ; 生成批次;持仓批次仍由 CUDA 显存上限控制
probes = 2                   ; 每个探测使用 3 个兄弟动作 × 4 个共享补全
; 复杂度硬顶取自生产组合 4 个成员的实测上限(11–13 token、时序嵌套 ≤2)。
; gfn_0921 实测:放宽到 24 token 时 79–92% 样本贴在 15–17 token,G1 失败 0.5%→13.9%、现金仓 6.6%→21.2%。
max_tokens = 13              ; 前缀序列全部节点(算子 + 操作数 + 窗口 + 常数)
max_ts_depth = 2             ; 任一根到叶路径上的时序算子层数
train_steps = 4
learning_rate = 0.002
opd_strength = 0.1           ; 辅助梯度范数相对 TB 的比例
rho_max = 0.9                ; 与组合 / 每个成员的最高正相关上限
archive_size = 32
reweight_iterations = 3
reweight_batch = 32
reweight_every = 5           ; 首轮 / 每五轮及接纳新构件后联合重配权重

[single]
; 单 alpha 目标(python -m foundry mine DIR --objective single):候选按自身持仓打分,用(相关性, Sharpe)门准入。
; 门的推导(Treynor–Black):组合 P 与候选 A 的最优合成 Sharpe² = S_p² + AR²,AR = (S_a − ρ·S_p)/√(1−ρ²)
;   ⇒ 对组合贡献相同的候选落在同一条曲线 S_a = ρ·S_p + κ·√(1−ρ²) 上:ρ 越低,要求的 Sharpe 越低。
; κ 由"期望组合 Sharpe 增量 ≥ [portfolio] min_sharpe_gain"定:观测 AR = 真值 + 噪声,经验贝叶斯后验均值
;   E[AR|观测] = m + s·(观测 − m) ⇒ κ = m + (√((S_p+Δ)²−S_p²) − m)/s。
; m、s 不是配置项:每轮按当前参照组合在一份固定的普通候选总体(语法均匀随机采样)及其"信号推迟 1–3 年"的噪声孪生上实测,
;   m = 总体观测 AR 的均值,s = 1 − Var(孪生的 AR)/Var(总体的 AR)。2026-09-21 实测(2,994 条):
;   对满仓等权起点 m=−0.38、s=0.49、κ=0.69;对生产组合 m=−1.06、s=0.29、κ=3.37(门自行关闭)。
; G2 = Sharpe ≥ max(组合未知, 组合已知)(锚点 ρ=0.7 ↔ Sharpe 1.5;要求随相关性单调不降):
;   组合未知:N = [portfolio] max_members 个 Sharpe 同为 S、两两相关 ρ 的可交换 alpha 等权组合 Sharpe_N = S·√(N/(1+(N−1)ρ)),
;     能搭出目标 T 的条件 S ≥ T·√((1+(N−1)ρ)/N);T 由锚点定(N=40 时 T=1.78)。ρ = 候选与池内成员的平均相关。
;   组合已知:上面的 TB 曲线,但成员权重 ∈(0,1] 不能做空组合 ⇒ ρ 超过 ρ* = S_p/√(S_p²+κ²) 后要求停在峰值 √(S_p²+κ²)。
anchor_correlation = 0.7
anchor_sharpe = 1.5
calibration_sample = 8192    ; 总体的采样条数(去重、去现金仓后约 3,000 条,常驻显存)
recent_years = 2             ; 窗口内最近 N 个日历年,每年 Sharpe 都必须 > recent_year_sharpe
recent_year_sharpe = 1.0
; 门内候选的多目标效用 U = u_S·(weight_sharpe + weight_drawdown·u_D + weight_return·u_R):Sharpe 为主维度,
; u_S = tanh(S⁺/sharpe_scale),u_D = max(0, 1−|最大回撤|/drawdown_full),u_R = tanh(CAGR⁺/return_scale)。
weight_sharpe = 0.6
weight_drawdown = 0.2
weight_return = 0.2
sharpe_scale = 2.0
drawdown_full = 0.6          ; 回撤达到该值时 u_D = 0;项目目标回撤 30% 对应 u_D = 0.5
return_scale = 1.0
; 门外候选的约束违反量 V = G2 的 Sharpe 缺口/尺度 + Σ 近年 Sharpe 缺口/尺度(只影响搜索奖励);尺度取违反者的 p75。
violation_scale_sharpe = 1.3
violation_scale_year = 3.35

[monitor]
frame_seconds = 0.1          ; 面板本地重绘间隔(只读本地文件)
push_seconds = 2             ; 云端状态推送的最小间隔(单条 SSH 长连接,服务器侧按变化推送)
