name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly (Mon 03:17 UTC): catch numpy/gcc dependency drift on loose >= pins

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build deps
        run: pip install numpy

      - name: Build C++ extensions
        run: bash backtest/build.sh

      - name: Kernel smoke on synthetic data
        run: python .github/ci_smoke.py

  linux-sanitize:
    # same build + smoke with ASan/UBSan-instrumented extensions: catches OOB / UAF / UB
    # in the hand-written OpenMP kernels that a plain run silently survives.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: pip install numpy

      - name: Build sanitized C++ extensions
        run: EXTRA_CFLAGS='-g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all' bash backtest/build.sh

      - name: Kernel smoke under ASan/UBSan
        # libasan must be loaded before CPython for interceptors; leak check off (CPython noise).
        run: |
          export LD_PRELOAD="$(g++ -print-file-name=libasan.so)"
          export ASAN_OPTIONS='detect_leaks=0:halt_on_error=1'
          export UBSAN_OPTIONS='print_stacktrace=1:halt_on_error=1'
          python .github/ci_smoke.py

  windows-msys2:
    # mirrors the real dev toolchain: Windows CPython + msys2 ucrt64 g++ → .pyd
    # (the __GLIBC__/Windows split is exactly where linux-only symbol bugs hide).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.13'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install build deps
        run: python -m pip install numpy

      - name: Build C++ extensions (.pyd)
        shell: msys2 {0}
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash backtest/build.sh

      - name: Kernel smoke on synthetic data
        run: python .github/ci_smoke.py
