name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly (Mon 03:17 UTC): catch numpy/gcc drift on loose >= pins

# CI has no GPU and no market data: it builds the native extensions and runs the tests that need neither
# (formula layer, native ABI and kernel invariants, search policy, dashboard layout). The data and GPU suites
# (tests/test_markets.py, tests/test_production.py, tests/test_portfolio.py, tests/test_search.py) run locally.
env:
  CPU_TESTS: tests.test_expr tests.test_native tests.test_policy tests.test_monitor

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy rich
      - run: bash build.sh
      - run: python -m unittest -v $CPU_TESTS

  linux-sanitize:
    # the same build and tests with ASan/UBSan-instrumented extensions: out-of-bounds, use-after-free and UB in the
    # hand-written OpenMP kernels that a plain run silently survives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy rich
      - run: EXTRA_CFLAGS='-g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all' bash build.sh
      - name: Tests under ASan/UBSan
        # libasan must be loaded before CPython for its interceptors; leak checking is CPython noise
        run: |
          export LD_PRELOAD="$(g++ -print-file-name=libasan.so)"
          export ASAN_OPTIONS='detect_leaks=0:halt_on_error=1'
          export UBSAN_OPTIONS='print_stacktrace=1:halt_on_error=1'
          python -m unittest -v tests.test_expr tests.test_native tests.test_policy

  windows-msys2:
    # the real development toolchain: Windows CPython + msys2 ucrt64 g++ -> .pyd
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: python -m pip install numpy rich
      - name: Build extensions (.pyd)
        shell: msys2 {0}
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash build.sh
      - run: python -m unittest -v tests.test_expr tests.test_native tests.test_policy tests.test_monitor
