name: Repository checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Enforce the tracked-file allowlist
        run: |
          forbidden='^(tests?|scripts|validation|tmp|var|logs|output|docs|production|venues|mcp-ssh|\.claude|\.codex)/'
          forbidden+='|^(AGENTS\.md|CLAUDE\.md|\.gitignore|\.gitattributes|build\.sh|\.mcp\.json)$'
          forbidden+='|(^|/)(\.env(\..*)?|hosts\.json|id_(rsa|ed25519)[^/]*)$'
          forbidden+='|\.(pem|key|p12|pfx|log|tar|tar\.gz|tgz|zip|7z|pkl|pickle|npz|npy|pyc|pyd|so|dll)$'
          bad=$(git ls-files | grep -E "$forbidden" || true)
          raw=$(git ls-files guides/benchmarks | grep -vE '\.(md|csv)$|/summary\.json$' || true)
          if [ -n "$bad$raw" ]; then
            printf 'Files that must stay local:\n%s\n%s\n' "$bad" "$raw"
            exit 1
          fi
      - name: Install static tooling and build dependencies
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install --group dev numpy
      - name: Check tracked files without running Foundry
        run: python -m pre_commit run --all-files --show-diff-on-failure
      - name: Build native extensions from README commands
        run: |
          sed -n '/<!-- native-build:start -->/,/<!-- native-build:end -->/p' README.md \
            | sed -n '/^```bash$/,/^```$/p' | sed '1d;$d' > /tmp/native-build.sh
          test -s /tmp/native-build.sh
          bash -euo pipefail /tmp/native-build.sh
          git clean -fdX foundry

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  required:
    name: Repository checks
    if: always()
    needs: [static, dependency-review, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$STATIC_RESULT" = success
          test "$CODEQL_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_RESULT" = success
          fi
