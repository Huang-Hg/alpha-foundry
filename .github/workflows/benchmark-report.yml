name: Benchmark evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify saved evidence
        working-directory: guides/benchmarks/parallel-cpu-20261116
        run: sha256sum -c SHA256SUMS
      - name: Verify discovery evidence
        working-directory: guides/benchmarks/api-boundary-l4-20261116
        run: sha256sum -c SHA256SUMS
      - name: Verify non-formula evidence
        working-directory: guides/benchmarks/nonformula-l4-20261116
        run: sha256sum -c SHA256SUMS
      - name: Verify registration evidence
        working-directory: guides/benchmarks/registration-l4-20261116
        run: sha256sum -c SHA256SUMS
      - name: Verify selected data snapshots
        run: sha256sum -c data/SHA256SUMS
      - name: Bind evidence to the proposed source
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import tarfile

          root = Path('guides/benchmarks/parallel-cpu-20261116')
          summary = json.loads((root / 'summary.json').read_text())
          comparisons = json.loads((root / 'comparisons.json').read_text())
          expected = {f'{name}/{size}' for name in ('workers', 'previous-cpu', 'a100', 'l4') for size in (64, 4096)}
          if summary['schema'] != 'foundry-parallel-cpu-v1' or not summary['passed'] or set(comparisons) != expected:
              raise SystemExit('The fixed CPU worker/GPU comparison is incomplete')
          if not all(row['passed'] for row in comparisons.values()):
              raise SystemExit('CPU worker/GPU semantic parity failed')
          manifest = None
          for workers in (1, 8):
              folder = root / f'workers-{workers}'
              evidence = json.loads((folder / 'benchmark.json').read_text())['foundry']
              checks = json.loads((folder / 'summary.json').read_text())
              plan = json.loads((folder / 'plan.json').read_text())
              if evidence['schema'] != 'foundry-benchmark-v2' or not checks['passed']:
                  raise SystemExit('CPU benchmark validation failed')
              if checks['operator_cases']['observed'] != 124 or checks['backend'] != 'cpu':
                  raise SystemExit('CPU operator coverage is incomplete')
              if plan['parameters']['cpu']['workers'] != workers or evidence['omp_num_threads'] != '1' or evidence['openblas_num_threads'] != '1':
                  raise SystemExit('CPU outer/inner concurrency differs from the recorded contract')
              if manifest is not None and manifest != evidence['source_sha256']:
                  raise SystemExit('Worker comparison changed source')
              manifest = evidence['source_sha256']
          pools = json.loads((root / 'threadpools.json').read_text())
          if {row['user_api'] for row in pools if row['num_threads'] == 1} != {'openmp', 'blas'}:
              raise SystemExit('Inner native pools were not verified')

          def canonical(content):
              return content.replace(b'\r\n', b'\n').rstrip() + b'\n'

          suffixes = {'.py', '.cpp', '.cu', '.cuh', '.hpp', '.h'}
          tracked = {p.as_posix() for folder in ('foundry', 'validation')
                     for p in Path(folder).rglob('*') if p.suffix in suffixes}
          recorded = {name for name in manifest if name.startswith(('foundry/', 'validation/'))}
          removed = {'foundry/search/proposer/src/gfn.cpp'}
          clients = {'validation/benchmarks/nonformula.py', 'validation/benchmarks/tensor_programs.py',
              'validation/test_tensor_programs.py'}
          routing = {'foundry/api.py', 'foundry/__main__.py'}
          registration_changes = {'foundry/study/cache.py', 'foundry/study/pipeline.py',
              'foundry/study/resources.py', 'foundry/study/session.py', 'foundry/study/store.py',
              'validation/test_candidates.py', 'validation/test_cuda_candidates.py'}
          added = {'validation/benchmarks/discovery.py', 'foundry/search/proposer/model.py', 'foundry/search/proposer/sampling.py',
              'foundry/search/proposer/device_sampling.py', 'foundry/search/proposer/batch.py', 'foundry/study/feedback.py'} | clients
          migration = removed | added | {'foundry/api.py', 'foundry/__main__.py', 'foundry/search/driver.py',
              'foundry/search/proposer/gfn.py', 'foundry/search/proposer/random.py',
              'validation/test_policy.py', 'validation/test_architecture.py', 'build.sh', 'requirements.txt',
              'foundry/types.py', 'foundry/monitor/components.py', 'foundry/monitor/objectives.py',
              'foundry/monitor/schema.py', 'foundry/rpc/schema.py', 'foundry/search/diagnostics.py',
              'foundry/search/objective.py', 'foundry/search/proposer/external.py',
              'foundry/study/pipeline.py', 'foundry/study/resources.py', 'foundry/study/session.py',
              'validation/test_monitor.py', 'validation/test_search.py'} | registration_changes
          if tracked != (recorded - removed) | added:
              raise SystemExit('Source coverage changed; publish a new authorized cloud run')
          with tarfile.open(root / 'source.tar.gz') as archive:
              for name, digest in manifest.items():
                  measured = archive.extractfile(name).read()
                  if hashlib.sha256(measured).hexdigest() != digest:
                      raise SystemExit(f'CPU evidence checksum failed: {name}')
                  if name not in migration and canonical(Path(name).read_bytes()) != canonical(measured):
                      raise SystemExit(f'Cloud evidence is stale for: {name}')
          discovery = Path('guides/benchmarks/api-boundary-l4-20261116')
          latest = json.loads((discovery / 'measured/plan.json').read_text())['source_sha256']
          smoke = json.loads((discovery / 'smoke/plan.json').read_text())['source_sha256']
          if tracked != set(latest) | clients or smoke != latest:
              raise SystemExit('Discovery source coverage or smoke identity differs')
          for stage, epochs, batch in (('smoke', 1, 32), ('measured', 8, 512)):
              result = json.loads((discovery / stage / 'summary.json').read_text())
              if not result['passed'] or result['epochs'] != epochs or result['ordinary_proposals'] != epochs * batch or not result['policy_changed']:
                  raise SystemExit('Discovery learning trajectory is incomplete')
              if result['policy_device'] != 'cuda' or result['policy_dtype'] != 'float32':
                  raise SystemExit('Policy training did not use CUDA FP32')
          parity = json.loads((discovery / 'parity.json').read_text())
          if not parity['passed'] or parity['maximum_absolute_error'] != 0 or parity['counts'] != {
                  'candidates': 4288, 'decisions': 4288, 'accepted': 8, 'reweights': 8}:
              raise SystemExit('Resident-feedback semantic parity is incomplete')
          with tarfile.open(discovery / 'source.tar.gz') as archive:
              for name, digest in latest.items():
                  measured = archive.extractfile(name).read()
                  if hashlib.sha256(measured).hexdigest() != digest:
                      raise SystemExit(f'Discovery evidence checksum failed: {name}')
                  if name not in routing | registration_changes and canonical(Path(name).read_bytes()) != canonical(measured):
                      raise SystemExit(f'Discovery evidence is stale for: {name}')
          nonformula = Path('guides/benchmarks/nonformula-l4-20261116')
          current = json.loads((nonformula / 'measured/plan.json').read_text())['source_sha256']
          smoke = json.loads((nonformula / 'smoke/plan.json').read_text())['source_sha256']
          if tracked != set(current) or smoke != current:
              raise SystemExit('Non-formula source coverage or smoke identity differs')
          differences = {name for name in current.keys() | latest.keys() if current.get(name) != latest.get(name)}
          audit = json.loads((nonformula / 'source-audit.json').read_text())
          if differences != clients | routing or differences != set(audit['changes']):
              raise SystemExit('Non-formula integration changed the reviewed compute core')
          with tarfile.open(nonformula / 'source.tar.gz') as archive:
              for name, digest in current.items():
                  measured = archive.extractfile(name).read()
                  if hashlib.sha256(measured).hexdigest() != digest:
                      raise SystemExit(f'Non-formula evidence checksum failed: {name}')
                  if name not in registration_changes and canonical(Path(name).read_bytes()) != canonical(measured):
                      raise SystemExit(f'Non-formula evidence is stale for: {name}')
          for stage, count in (('smoke', 8), ('measured', 256)):
              result = json.loads((nonformula / stage / 'summary.json').read_text())
              if not result['passed'] or set(result['cases']) != {'mlp', 'factor'}:
                  raise SystemExit('Non-formula workload coverage is incomplete')
              for case in result['cases'].values():
                  if not all(case[k] for k in ('passed', 'feedback_zero_copy', 'artifacts_pit_valid', 'resources_released')):
                      raise SystemExit('Non-formula feedback or lifecycle contract failed')
                  if case['candidates'] != count or case['formula_calls'] or case['gfn_calls'] or case['parameter_change'] <= 0:
                      raise SystemExit('Non-formula learning trajectory is incomplete')
          analysis = json.loads((nonformula / 'analysis.json').read_text())
          submissions = json.loads((nonformula / 'submission.json').read_text())
          for mode, passed in (('mlp', 47), ('factor', 74)):
              case = analysis['cases'][mode]
              contract = submissions[mode]
              if case['counters']['g2'] != passed or case['accepted'] != 0 or case['rho_range'][0] <= .9:
                  raise SystemExit('Hard admission and search selection evidence disagree')
              if not all(contract[k] for k in ('passed', 'accepted', 'cas_conflict_rejected', 'query_readonly')) or contract['batch_vs_single_max_absolute_error'] != 0:
                  raise SystemExit('Independent array submission contract failed')
          registration = Path('guides/benchmarks/registration-l4-20261116')
          measured = json.loads((registration / 'measured/plan.json').read_text())['source_sha256']
          previous = json.loads((registration / 'previous/plan.json').read_text())['source_sha256']
          smoke = json.loads((registration / 'smoke/plan.json').read_text())['source_sha256']
          if previous != current or smoke != measured or set(measured) != tracked:
              raise SystemExit('Registration source identity or coverage changed')
          changed = {name for name in measured if measured[name] != previous[name]}
          audit = json.loads((registration / 'source-audit.json').read_text())
          if changed != registration_changes or changed != set(audit['changes']):
              raise SystemExit('Registration changes exceed the reviewed ownership/IO patch')
          with tarfile.open(registration / 'source.tar.gz') as archive:
              for name, digest in measured.items():
                  content = archive.extractfile(name).read()
                  if hashlib.sha256(content).hexdigest() != digest or canonical(Path(name).read_bytes()) != canonical(content):
                      raise SystemExit(f'Registration evidence is stale for: {name}')
          parity = json.loads((registration / 'parity.json').read_text())
          if not parity['passed'] or parity['maximum_absolute_error'] != 0 or parity['counts'] != {'candidates': 512, 'decisions': 512}:
              raise SystemExit('Registration numerical and decision parity is incomplete')
          for stage, count in (('smoke', 8), ('previous', 256), ('measured', 256)):
              result = json.loads((registration / stage / 'summary.json').read_text())
              if not result['passed'] or set(result['cases']) != {'mlp', 'factor'}:
                  raise SystemExit('Registration workload coverage is incomplete')
              for case in result['cases'].values():
                  if case['candidates'] != count or not all(case[k] for k in ('passed', 'artifacts_pit_valid', 'resources_released', 'feedback_zero_copy')):
                      raise SystemExit('Registration PIT or lifecycle evidence failed')
          submissions = json.loads((registration / 'submission.json').read_text())
          for contract in submissions.values():
              if not all(contract[k] for k in ('passed', 'accepted', 'cas_conflict_rejected', 'query_readonly')) or contract['batch_vs_single_max_absolute_error'] != 0:
                  raise SystemExit('Registration submission contract failed')
          allowed = {'foundry/api.py', 'foundry/__main__.py', 'foundry/__init__.py', 'foundry/config.py',
              'foundry/backtest/cpu.py', 'foundry/backtest/perpetual_cpu.py', 'foundry/ops/src/module.cpp',
              'foundry/numeric/parallel.py', 'foundry/study/pipeline.py', 'foundry/study/resources.py',
              'validation/test_cpu_parallel.py', 'validation/test_runtime.py', 'validation/bench_workloads.py',
              'validation/conftest.py', 'validation/benchmarks/run.py', 'validation/benchmarks/report.py'}
          for gpu, record in summary['devices'].items():
              artifact = Path('guides/benchmarks/compact-multigpu-20261116') / gpu / 'benchmark.json'
              if hashlib.sha256(artifact.read_bytes()).hexdigest() != record['gpu_benchmark_sha256']:
                  raise SystemExit(f'GPU evidence changed: {gpu}')
              previous = json.loads(artifact.read_text())['foundry']['source_sha256']
              different = {name for name in manifest.keys() | previous.keys() if manifest.get(name) != previous.get(name)}
              if different - allowed or different != set(record['reviewed_source_changes']):
                  raise SystemExit('GPU source changes exceed the reviewed CPU/scheduling patch')
          corpus = Path('guides/benchmarks/fixtures/us-formulas.json').read_bytes()
          if hashlib.sha256(corpus).hexdigest() != evidence['corpus_sha256']:
              raise SystemExit('Formula corpus differs from the measured workload')
          print('Saved Colab evidence matches this source; no numerical code was executed')
      - name: Publish the cloud measurement summary
        env:
          REPORT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import re

          base = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/blob/"
                  f"{os.environ['REPORT_REVISION']}/guides/benchmarks/parallel-cpu-20261116/")
          report = Path('guides/benchmarks/parallel-cpu-20261116/README.md').read_text()
          report = re.sub(r'\]\(([^:/)#]+)\)', lambda match: '](' + base + match[1] + ')', report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('This job verifies saved Colab evidence; it does not execute numerical tests.\n\n')
              output.write(report)
              discovery_base = base.replace('parallel-cpu-20261116', 'api-boundary-l4-20261116')
              discovery_report = Path('guides/benchmarks/api-boundary-l4-20261116/README.md').read_text()
              discovery_report = re.sub(r'\]\(([^:/)#]+)\)', lambda match: '](' + discovery_base + match[1] + ')', discovery_report)
              output.write('\n\n' + discovery_report)
              nonformula_base = base.replace('parallel-cpu-20261116', 'nonformula-l4-20261116')
              nonformula_report = Path('guides/benchmarks/nonformula-l4-20261116/README.md').read_text()
              nonformula_report = re.sub(r'\]\(([^:/)#]+)\)', lambda match: '](' + nonformula_base + match[1] + ')', nonformula_report)
              output.write('\n\n' + nonformula_report)
              registration_base = base.replace('parallel-cpu-20261116', 'registration-l4-20261116')
              registration_report = Path('guides/benchmarks/registration-l4-20261116/README.md').read_text()
              registration_report = re.sub(r'\]\(([^:/)#]+)\)', lambda match: '](' + registration_base + match[1] + ')', registration_report)
              output.write('\n\n' + registration_report)
      - name: Preserve benchmark evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            guides/benchmarks/parallel-cpu-20261116/
            guides/benchmarks/api-boundary-l4-20261116/
            guides/benchmarks/nonformula-l4-20261116/
            guides/benchmarks/registration-l4-20261116/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
