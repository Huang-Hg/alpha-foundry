name: Benchmark evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify selected data
        run: sha256sum --quiet -c data/SHA256SUMS
      - name: Publish measured summary
        env:
          REPORT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          folder = Path('guides/benchmarks/program-transitions-l4-20261117')
          summary = json.loads((folder / 'summary.json').read_text())
          if not summary['passed']:
              raise SystemExit('Cloud acceptance did not pass')
          for name, expected in summary['source'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Measured source differs: ' + name)
          base = (f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/blob/"
                  f"{os.environ['REPORT_REVISION']}/{folder.as_posix()}/")
          report = re.sub(r'\]\(([^:/)#]+)\)', lambda match: '](' + base + match[1] + ')',
                          (folder / 'README.md').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Saved cloud results and source checksums; this job does not run numerical tests.\n\n')
              output.write(report)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measured-transitions-${{ github.event.pull_request.head.sha || github.sha }}
          path: guides/benchmarks/program-transitions-l4-20261117/
          if-no-files-found: error
          retention-days: 30
